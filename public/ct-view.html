    <!-- VIEW: CT STOCK -->
    <div id="view-ct" class="view-panel hidden w-full space-y-4">
      <div class="flex items-center justify-between gap-3 rounded-2xl bg-slate-900 p-4 sm:p-5 text-white shadow-lg">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-orange-500/20 text-orange-300">
            <i data-lucide="zap" class="h-5 w-5"></i>
          </div>
          <div>
            <h2 class="text-base font-bold">สต๊อก CT</h2>
            <p class="text-xs text-slate-400">รับเข้าและเบิก CT ด้วย Serial Number</p>
          </div>
        </div>
        <button type="button" onclick="app.showView('dashboard')" class="rounded-lg bg-slate-800 px-3 py-2 text-xs font-semibold text-slate-200 hover:bg-slate-700">กลับหน้าหลัก</button>
      </div>
      <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="border-b border-slate-100 bg-orange-50/70 p-4 sm:p-5">
          <h3 class="flex items-center gap-2 text-sm font-bold text-slate-800 sm:text-base">
            <i data-lucide="package-plus" class="h-4 w-4 text-orange-600"></i> รับเข้าและเบิก CT
          </h3>
          <p class="mt-1 text-xs text-slate-500">บันทึก SN, รุ่น และอัตราส่วนเมื่อรับเข้า พร้อมโครงการ ผู้รับผิดชอบ และวันที่เมื่อเบิก</p>
        </div>
        <div class="grid gap-4 p-4 sm:p-5 xl:grid-cols-2">
          <form id="ct-stock-form" onsubmit="app.addCtsToStock(event)" class="space-y-3">
            <h4 class="text-xs font-bold text-slate-700">รับ CT เข้าสต๊อก</h4>
            <div>
              <label for="ct-model" class="mb-1 block text-xs font-semibold text-slate-700">รุ่น CT <span class="text-rose-500">*</span></label>
              <input type="text" id="ct-model" required placeholder="ระบุรุ่น" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm">
            </div>
            <div>
              <label for="ct-ratio" class="mb-1 block text-xs font-semibold text-slate-700">อัตราส่วน CT <span class="text-rose-500">*</span></label>
              <input type="text" id="ct-ratio" required placeholder="เช่น 200/5" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm">
            </div>
            <div>
              <label for="ct-serials" class="mb-1 block text-xs font-semibold text-slate-700">Serial Number <span class="text-rose-500">*</span></label>
              <textarea id="ct-serials" rows="3" required placeholder="กรอก SN ทีละบรรทัด เพื่อรับเข้าหลายชิ้นพร้อมกัน" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 font-mono text-sm"></textarea>
            </div>
            <button type="submit" class="flex w-full items-center justify-center gap-1.5 rounded-xl bg-orange-600 py-2.5 text-xs font-bold text-white shadow-sm hover:bg-orange-700">
              <i data-lucide="package-plus" class="h-4 w-4"></i> บันทึกรับเข้าสต๊อก
            </button>
          </form>

          <form id="ct-issue-form" onsubmit="app.issueCTFromStock(event)" class="space-y-3">
            <h4 class="text-xs font-bold text-slate-700">เบิก CT ไปโครงการ</h4>
            <div>
              <label for="ct-issue-item" class="mb-1 block text-xs font-semibold text-slate-700">CT ในสต๊อก <span class="text-rose-500">*</span></label>
              <select id="ct-issue-item" required class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm"></select>
            </div>
            <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
              <div>
                <label for="ct-issue-project" class="mb-1 block text-xs font-semibold text-slate-700">โครงการ <span class="text-rose-500">*</span></label>
                <select id="ct-issue-project" required class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm"></select>
              </div>
              <div>
                <label for="ct-issue-by" class="mb-1 block text-xs font-semibold text-slate-700">ผู้รับผิดชอบ <span class="text-rose-500">*</span></label>
                <input type="text" id="ct-issue-by" required placeholder="ชื่อผู้รับผิดชอบ" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm">
              </div>
              <div>
                <label for="ct-issue-date" class="mb-1 block text-xs font-semibold text-slate-700">วันที่เบิก <span class="text-rose-500">*</span></label>
                <input type="date" id="ct-issue-date" required class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm">
              </div>
            </div>
            <button type="submit" class="flex w-full items-center justify-center gap-1.5 rounded-xl bg-sky-600 py-2.5 text-xs font-bold text-white shadow-sm hover:bg-sky-700">
              <i data-lucide="package-minus" class="h-4 w-4"></i> บันทึกการเบิก
            </button>
          </form>
        </div>
        <div class="border-t border-slate-100 bg-slate-50/70 p-4 sm:p-5">
          <div id="ct-summary" class="mb-4 grid grid-cols-2 gap-2 sm:grid-cols-4"></div>
          <div class="grid gap-2 sm:grid-cols-[minmax(0,1fr)_200px]">
            <label class="sr-only" for="ct-filter-search">ค้นหา Serial Number หรือรุ่น</label>
            <input id="ct-filter-search" type="search" oninput="app.renderCTInventory()" placeholder="ค้นหา Serial Number หรือรุ่น..." class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-xs focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-100">
            <label class="sr-only" for="ct-filter-status">กรองตามสถานะ</label>
            <select id="ct-filter-status" onchange="app.renderCTInventory()" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-xs focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-100">
              <option value="all">ทุกสถานะ</option>
              <option value="warehouse">ในสต๊อก</option>
              <option value="issued">เบิกแล้ว</option>
              <option value="damaged">ชำรุด</option>
            </select>
          </div>
        </div>
        <div id="ct-inventory-list" class="overflow-x-auto">
          <div class="p-6 text-center text-xs text-slate-400">กำลังโหลดสต๊อก CT...</div>
        </div>
      </section>
    </div>
