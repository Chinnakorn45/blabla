<section id="view-inverter-claims" class="view-panel hidden w-full space-y-5">
  <header class="flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-slate-900 p-5 text-white shadow-lg">
    <div><div class="text-xs uppercase tracking-widest text-amber-300">Warranty Service</div><h2 class="text-xl font-bold">ติดตามอินเวอร์เตอร์ส่งเคลม</h2><p class="mt-1 text-sm text-slate-300">บันทึกและติดตามสถานะการส่งเคลมอินเวอร์เตอร์</p></div>
    <button onclick="app.newInverterClaim()" class="rounded-xl bg-amber-500 px-4 py-2.5 text-sm font-bold text-slate-950"><i data-lucide="plus" class="mr-1 inline h-4 w-4"></i>เพิ่มรายการเคลม</button>
  </header>
  <div id="inverter-claim-modal" class="app-modal-backdrop hidden" onclick="if(event.target===this) app.closeInverterClaimForm()">
  <form id="inverter-claim-form" role="dialog" aria-modal="true" aria-labelledby="inverter-claim-modal-title" onsubmit="app.saveInverterClaim(event)" class="app-modal-card app-modal-card-wide space-y-4">
    <div class="app-modal-heading"><h3 id="inverter-claim-modal-title">บันทึกรายการเคลมอินเวอร์เตอร์</h3><button type="button" onclick="app.closeInverterClaimForm()" aria-label="ปิดหน้าต่าง" class="app-modal-close">&times;</button></div>
    <input id="inverter-claim-id" type="hidden">
    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <label class="text-sm font-semibold">รุ่นอินเวอร์เตอร์<input id="inverter-claim-model" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal"></label>
      <label class="text-sm font-semibold">Serial Number<input id="inverter-claim-serial" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-mono font-normal"></label>
      <label class="text-sm font-semibold">โครงการ<select id="inverter-claim-project" required class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-normal"><option value="">เลือกโครงการ</option></select></label>
      <label class="text-sm font-semibold">วันที่ส่งเคลม<input id="inverter-claim-date" type="date" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal"></label>
      <label class="text-sm font-semibold">ผู้รับเรื่อง<input id="inverter-claim-contact" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal"></label>
      <label class="text-sm font-semibold">เลขพัสดุ<input id="inverter-claim-tracking" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-mono font-normal" placeholder="กรอกเมื่อมีเลขพัสดุ"></label>
      <label class="text-sm font-semibold">สถานะ<select id="inverter-claim-status" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-normal"><option value="sent">ส่งเคลมแล้ว</option><option value="checking">กำลังตรวจสอบ</option><option value="repairing">กำลังซ่อม</option><option value="replacement">รอเปลี่ยนเครื่อง</option><option value="resolved">ดำเนินการเสร็จแล้ว</option></select></label>
    </div>
    <label class="block text-sm font-semibold">ผลการเคลม / หมายเหตุ<textarea id="inverter-claim-result" rows="2" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal"></textarea></label>
    <div class="flex justify-end gap-2"><button type="button" onclick="app.closeInverterClaimForm()" class="rounded-lg bg-slate-100 px-4 py-2 text-sm font-semibold">ยกเลิก</button><button class="rounded-lg bg-amber-500 px-4 py-2 text-sm font-bold text-slate-950">บันทึก</button></div>
  </form>
  </div>
  <input id="inverter-claim-search" oninput="app.renderInverterClaims()" placeholder="ค้นหารุ่น, Serial Number หรือโครงการ..." class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm">
  <div id="inverter-claims-list" class="space-y-3"></div>
</section>
